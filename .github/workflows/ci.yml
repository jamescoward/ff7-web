# Tier 1 checks for every PR and for main (docs/AUTOMATION.md).
#
# - unit: the asset guard on the repository, plus every test that needs
#   no core build.
# - tier1: builds the pinned core and the headless runner from scratch
#   (about a minute; no cache, so a cache can't hide a toolchain change),
#   runs the Tier 1 tests, and runs every scenario twice and compares the
#   outputs byte for byte.
# - web-core + web: builds the core and the browser link on the runner, then
#   runs the browser wrapper's tests (web/test) and the benchmark page's tests
#   (web/bench/test) on Chromium and WebKit through Playwright, inside the
#   pinned Playwright image (no apt install; #90).
#   A missing browser fails the job (WEB_REQUIRE_BROWSERS=1).
#
# Read-only token, no secrets. Nothing from the game is involved: Tier 1
# uses original homebrew only.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Asset guard
        run: node tools/asset-guard/check.js
      - name: Unit tests
        run: node --test 'runner/test/unit/**/*.test.js' 'tools/asset-guard/**/*.test.js' 'tools/preview/**/*.test.js'

  tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build core (pinned upstream and emsdk)
        run: core/build.sh
      - name: Check core
        run: core/check.sh
      - name: Build runner
        run: runner/build.sh
      - name: Tier 1 tests
        run: node --test 'runner/test/**/*.test.js'
      - name: Scenarios (each twice, outputs must match)
        run: |
          shopt -s nullglob
          files=(harness/scenarios/*.json)
          [ ${#files[@]} -gt 0 ] || { echo "no scenarios found"; exit 1; }
          ran=0
          for s in "${files[@]}"; do
            # Tier 2 scenarios need game data; only the private eval (tier2-eval.yml)
            # runs them, through runner/tier2.js. runner/scenario.js refuses them.
            if node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).tier === 2 ? 0 : 1)' "$s"; then
              echo "skip, tier 2 (private eval only): $s"
              continue
            fi
            ran=$((ran + 1))
            node runner/scenario.js "$s" > "$RUNNER_TEMP/a.json"
            node runner/scenario.js "$s" > "$RUNNER_TEMP/b.json"
            cmp "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json"
            echo "pass, deterministic: $s"
          done
          [ "$ran" -gt 0 ] || { echo "no tier 1 scenarios found"; exit 1; }
      - name: Build provenance
        if: always()
        run: cat core/dist/BUILD_INFO.json runner/dist/BUILD_INFO.json 2>/dev/null || true

  # The browser core is built on the runner (web-core) and handed to the
  # test job as an artifact. The test job runs in the official Playwright
  # image (Apache-2.0), pinned by digest, whose Chromium, WebKit and system
  # libraries are preinstalled: no apt install, so a slow Ubuntu mirror can't
  # stall it (#90: two 30-minute cancels on 2026-11-05/06 during
  # `playwright install --with-deps`).
  web-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      web: ${{ steps.has.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check for the browser wrapper
        id: has
        run: |
          if [ -x core/web/link.sh ] && [ -d web/test ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no browser wrapper on this commit (core/web/link.sh, web/test); nothing to test"
          fi
      - name: Build core (pinned upstream and emsdk)
        if: steps.has.outputs.web == 'true'
        run: core/build.sh
      - name: Link browser core
        if: steps.has.outputs.web == 'true'
        run: core/web/link.sh
      - name: Hand the browser core to the test job
        if: steps.has.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-core
          path: web/core/
          retention-days: 1
          if-no-files-found: error

  web:
    needs: web-core
    # Runs even if web-core failed (but not when the run is cancelled), and
    # then fails itself, so a broken build never shows up as a skipped (and so
    # passing) `web` check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright 1.63.0 on Ubuntu 24.04 (noble), pinned by its index digest.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: The browser core was built
        if: needs.web-core.result != 'success'
        run: |
          echo "::error::web-core did not succeed (${{ needs.web-core.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fetch the browser core
        if: needs.web-core.outputs.web == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-core
          path: web/core/
      # Playwright (Apache-2.0) is a test-only tool, pinned to an exact
      # version, installed outside the repository; never shipped in the site.
      # It uses the image's browsers (PLAYWRIGHT_BROWSERS_PATH=/ms-playwright),
      # which match this version; nothing is downloaded or apt-installed.
      - name: Install Playwright 1.63.0 (browsers come with the image)
        if: needs.web-core.outputs.web == 'true'
        run: |
          npm install --global --no-fund --no-audit playwright@1.63.0
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
      - name: Browser wrapper and benchmark page tests (Chromium, WebKit)
        if: needs.web-core.outputs.web == 'true'
        env:
          WEB_BROWSERS: chromium,webkit
          WEB_REQUIRE_BROWSERS: '1'
        run: node --test 'web/test/*.test.js' 'web/bench/test/*.test.js'
