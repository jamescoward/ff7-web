# Per-PR preview deployment to GitHub Pages (issue #14).
#
# Layout of the gh-pages branch (tools/preview/lib.js):
#   main/      latest main            pr-<n>/   one folder per open PR
#   index.html list of live previews  .nojekyll
#
# Security (docs/SECURITY.md):
# - Only PRs from this repository are deployed, never forks, so everyone
#   whose code runs here already has write access to the repository.
# - Least privilege within that: the build job (which will grow to run the
#   core build) has a read-only token. Only deploy and cleanup hold a write
#   token, and they run nothing but tools/preview's publish scripts and the
#   asset guard, on already-built static files. Cleanup uses the default
#   branch's copy of the tools.
# - The asset guard runs on the repo, on the built site and on the final
#   gh-pages tree. No secrets are used; the artifact holds static files only
#   and expires after a day.
#
# Owner setup (once): after the first run creates gh-pages, set
# Settings -> Pages -> Source: "Deploy from a branch", gh-pages, / (root).

name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions: {}

env:
  # The core (core.wasm, ~0.9 MB) will be in the site once the browser
  # wrapper lands; allow binaries up to the guard's 2 MiB file limit.
  PREVIEW_MAX_BINARY_BYTES: '2097152'

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      slot: ${{ steps.meta.outputs.slot }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "slot=pr-$PR" >> "$GITHUB_OUTPUT"; echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "slot=main" >> "$GITHUB_OUTPUT"; echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Asset guard (repository)
        run: node tools/asset-guard/check.js
      - name: Assemble site
        env:
          SLOT: ${{ steps.meta.outputs.slot }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: node tools/preview/build.js --out "$RUNNER_TEMP/site" --slot "$SLOT" --sha "$SHA" --repo "$GITHUB_REPOSITORY"
      - name: Asset guard (site)
        run: node tools/asset-guard/check.js --root "$RUNNER_TEMP/site" --walk --max-binary-bytes "$PREVIEW_MAX_BINARY_BYTES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          path: src
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: site
      - name: Check out gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: src/tools/preview/gh-pages-checkout.sh pages
      - name: Place preview
        env:
          SLOT: ${{ needs.build.outputs.slot }}
        run: node src/tools/preview/publish.js place --pages pages --slot "$SLOT" --site site
      - name: Asset guard (gh-pages tree)
        run: node src/tools/asset-guard/check.js --root pages --walk --max-binary-bytes "$PREVIEW_MAX_BINARY_BYTES"
      - name: Push gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ needs.build.outputs.slot }}
          SHA: ${{ needs.build.outputs.sha }}
        run: src/tools/preview/gh-pages-push.sh pages "Preview $SLOT at $SHA"
      - name: Comment preview link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; name="${GITHUB_REPOSITORY#*/}"
          url="https://$owner.github.io/$name/pr-$PR/"
          body="<!-- ff7-web-preview -->
          **Preview:** $url
          Commit \`${SHA:0:7}\`. Pages can take a minute or two to update after this comment."
          src/tools/preview/pr-comment.sh "$PR" "$body"

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Trusted tools from the default branch: the PR's own code isn't needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: src
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check out gh-pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: src/tools/preview/gh-pages-checkout.sh pages --existing-only
      - name: Remove preview
        if: steps.pages.outputs.exists == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: node src/tools/preview/publish.js remove --pages pages --slot "pr-$PR"
      - name: Push gh-pages
        if: steps.pages.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: src/tools/preview/gh-pages-push.sh pages "Remove preview pr-$PR"
      - name: Update comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          src/tools/preview/pr-comment.sh "$PR" "<!-- ff7-web-preview -->
          Preview removed: the PR is closed." --update-only
